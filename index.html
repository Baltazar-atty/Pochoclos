<nav>
  <!-- El cliente siempre navega sin pedir login -->
  <button id="btn-cliente" class="nav-btn active" onclick="cambiarRol('cliente')">
    <span class="icon">🍿</span> Inicio / Clientes
  </button>

  <!-- Botón dinámico que abre el modal de login si no hay sesión -->
  <button id="btn-login-modal" class="nav-btn" onclick="abrirModalLogin()">
    <span class="icon">🔑</span> Acceso Personal
  </button>

  <!-- Se muestran dinámicamente según la sesión iniciada con JS -->
  <button id="btn-admin" class="nav-btn hidden" onclick="cambiarRol('admin')">
    <span class="icon">👑</span> Panel Admin
  </button>
  <button id="btn-empleado" class="nav-btn hidden" onclick="cambiarRol('empleado')">
    <span class="icon">🛒</span> Registrar Ventas
  </button>
  <button id="btn-logout" class="nav-btn hidden" onclick="cerrarSesion()">
    <span class="icon">🚪</span> Salir
  </button>
</nav>
<div id="modal-login" class="modal-backdrop hidden">
  <div class="card modal-card">
    <h3>🔑 Ingreso de Personal</h3>
    <p class="text-subtle">Solo para Administradores y Vendedores de Carrito</p>
    
    <form id="form-login" onsubmit="procesarLogin(event)">
      <div class="form-group">
        <label for="login-email">Correo Electrónico:</label>
        <input type="email" id="login-email" class="form-control" required placeholder="ejemplo@pochoclos.com">
      </div>

      <div class="form-group">
        <label for="login-password">Contraseña:</label>
        <input type="password" id="login-password" class="form-control" required>
      </div>

      <div class="btn-group">
        <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
        <button type="button" class="btn btn-secondary" onclick="cerrarModalLogin()">Cancelar</button>
      </div>
    </form>
  </div>
</div>
<!-- Gestión de Empleados (Solo visible para Admin) -->
<h3>3. Gestión de Cuentas de Empleados</h3>
<div class="card form-card">
  <h4>➕ Crear Nuevo Empleado</h4>
  <form id="form-crear-empleado" onsubmit="crearEmpleado(event)">
    <div class="form-group">
      <input type="text" id="emp-nombre" class="form-control" placeholder="Nombre" required>
    </div>
    <div class="form-group">
      <input type="text" id="emp-apellido" class="form-control" placeholder="Apellido" required>
    </div>
    <div class="form-group">
      <input type="email" id="emp-email" class="form-control" placeholder="Email" required>
    </div>
    <div class="form-group">
      <input type="password" id="emp-password" class="form-control" placeholder="Contraseña asignada" required>
    </div>
    <div class="form-group">
      <label for="emp-carrito">Asignar a Carrito:</label>
      <select id="emp-carrito" class="form-control">
        <option value="1">Carrito #1: Plaza Central</option>
        <option value="2">Carrito #2: Peatonal / Playa</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Registrar Empleado</button>
  </form>

  <h4 style="margin-top:20px;">👥 Empleados Activos</h4>
  <ul id="tabla-empleados" class="zona-caliente-list">
    <!-- Se llena dinámicamente mediante JS -->
  </ul>
</div>
